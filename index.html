              </label>

                <input type="password" autoComplete="current-password" value={s.login.password} onChange={(e) => this.setState({ login: { ...s.login, password: e.target.value } })} style={st('height:42px;padding:0 12px;border-radius:10px;border:1px solid #2e2347;background:#0b0a0f;color:#f1eff5;font-size:15px')} />
              </label>
              {s.login.err && <div style={st('font-size:13px;color:#ef6b4a')}>{s.login.err}</div>}
              <div style={st('display:flex;gap:8px')}>
                <button type="submit" style={st('flex:1;height:46px;border:0;border-radius:10px;background:linear-gradient(90deg,#7c4ddb,#a374f0);color:#fff;font-size:15px;font-weight:500;cursor:pointer')}>{S.enter}</button>
                <button type="button" onClick={() => this.setState({ login: null })} style={st('height:46px;padding:0 16px;border-radius:10px;border:1px solid #5b3fb0;background:none;color:#f1eff5;font-size:15px;cursor:pointer')}>{S.cancel}</button>
              </div>
            </form>
          </div>
        )}

        {s.dataModal && (
          <div style={st('position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(11,10,15,0.7)')}>
            <div style={st('width:min(520px,100%);display:flex;flex-direction:column;gap:12px;padding:20px;background:#110e19;border:1px solid #5b3fb0;border-radius:16px')}>
              <div style={st("font-family:'Titan One',sans-serif;font-size:22px")}>{s.dataModal.kind === 'export' ? S.exportT : S.importT}</div>
              <div style={st('font-size:13px;color:#9a96a6')}>{s.dataModal.kind === 'export' ? S.exportSub : S.importSub}</div>
              <textarea readOnly={s.dataModal.kind === 'export'} value={s.dataModal.text} onChange={(e) => this.setState({ dataModal: { ...s.dataModal, text: e.target.value } })} rows={10} style={st('padding:10px 12px;border-radius:10px;border:1px solid #2e2347;background:#0b0a0f;color:#f1eff5;font-family:monospace;font-size:12px;line-height:1.4;resize:vertical')}></textarea>
              <div style={st('display:flex;gap:8px;flex-wrap:wrap')}>
                {s.dataModal.kind === 'export' ? (
                  <>
                    <button onClick={() => { try { navigator.clipboard.writeText(s.dataModal.text); this.setState({ dataModal: { ...s.dataModal, copied: true } }); } catch (e) {} }} style={st('flex:1;height:42px;border:0;border-radius:10px;background:linear-gradient(90deg,#7c4ddb,#a374f0);color:#fff;font-size:14px;cursor:pointer')}>{s.dataModal.copied ? S.copied : S.copy}</button>
                    <button onClick={() => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([s.dataModal.text], { type: 'application/json' })); a.download = 'soto-was-here-points.json'; a.click(); }} style={st('flex:1;height:42px;border-radius:10px;border:1px solid #5b3fb0;background:none;color:#f1eff5;font-size:14px;cursor:pointer')}>{S.download}</button>
                  </>
                ) : (
                  <button onClick={() => this.doImport()} style={st('flex:1;height:42px;border:0;border-radius:10px;background:linear-gradient(90deg,#7c4ddb,#a374f0);color:#fff;font-size:14px;cursor:pointer')}>{S.doImport}</button>
                )}
                <button onClick={() => this.setState({ dataModal: null })} style={st('height:42px;padding:0 16px;border-radius:10px;border:1px solid #2e2347;background:none;color:#9a96a6;font-size:14px;cursor:pointer')}>{S.close}</button>
              </div>
            </div>
          </div>
        )}
        <div key={isCity ? 'veil-' + s.city : 'veil-home'} className="soto-veil"></div>
      </div>
    );
  }
}

const SEED = [{ id: 'p1', city: 'genova', member: 'albi', title: { it: 'Boccadasse', en: 'Boccadasse' }, text: { it: 'Punto di esempio: modificalo o eliminalo dall\'Editor.', en: 'Sample point: edit or delete it from the Editor.' }, date: '2025-06-14', photo: '', status: 'published', lat: 44.3906, lon: 8.9737 }];
const memoryApi = {
  load: async () => SEED,
  save: async (p) => ({ ...p, id: p.id || 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) }),

/* Salvataggio permanente quando il sito gira come artifact su claude.ai:
   punti nel database dell'artifact (collezione "points"), foto nello spazio file dell'artifact.
   Fuori da claude.ai (Lovable, GitHub) window.claude non esiste e si usa memoryApi. */
const claudeApi = (() => {
  const cap = (name) => (window.claude && window.claude.use ? window.claude.use(name).catch(() => null) : Promise.resolve(null));
  let dbP = null, asP = null;
  const db = () => dbP || (dbP = cap('db'));
  const assets = () => asP || (asP = cap('assets'));
  const clean = (o) => JSON.parse(JSON.stringify(o));
  const newId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const fail = (e) => { throw new Error((e && (e.message || e.code)) || String(e)); };
  return {
    async load() {
      const D = await db(); if (!D) return memoryApi.load();
      const snap = await D.collection('points').get();
      return snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    },
    async save(p) {
      const D = await db(); if (!D) return memoryApi.save(p);
      const rec = clean({ ...p, id: p.id || newId() });
      await D.doc('points/' + rec.id).set(rec).catch(fail);
      return rec;
    },
    async remove(id) { const D = await db(); if (D) await D.doc('points/' + id).delete().catch(fail); },
    async uploadPhoto(file) {
      const A = await assets();
      const url = await readImg(file);
      if (!A) return url;
      const bin = atob(url.split(',')[1]), u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      const blob = new Blob([u8], { type: 'image/jpeg' });
      const r = await A.upload(blob, { type: blob.type || 'image/jpeg' }).catch(fail);
      return '/_blob/' + r.id;
    },
    async importAll(pts) {
      const D = await db(); if (!D) return memoryApi.importAll(pts);
      const out = pts.map((p) => clean({ ...p, id: p.id || newId() })), keep = new Set(out.map((p) => p.id));
      const cur = await D.collection('points').get();
      for (const d of cur.docs) if (!keep.has(d.id)) await D.doc('points/' + d.id).delete().catch(fail);
      for (const p of out) await D.doc('points/' + p.id).set(p).catch(fail);
      return out;
    }
  };
})();

export default function App() {
  return <SotoWasHere api={claudeApi} assets={FACES} options={{ pixelSize: 2, light: 'tramonto', autoRotate: true }} />;
}
